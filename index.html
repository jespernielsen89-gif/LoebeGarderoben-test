<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LøbeGarderoben v2.0 (Test)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">
    <!-- APP HEADER -->
    <header class="app-header">
      <div class="logo-badge">🏃 LøbeGarderoben <span class="badge-v2">v2.0</span></div>
      <p class="subtitle">Din intelligente, personlige løbe-påklædningsassistent</p>
    </header>

    <!-- VEJR & PARAMETRE -->
    <section class="card hero-card">
      <div class="card-title-row">
        <h2>1. Vejr & Betingelser</h2>
      </div>
      
      <button id="btn-location" class="btn-primary btn-glow">
        📍 Hent lokalt vejr via GPS
      </button>

      <div id="weather-info" class="weather-grid hidden">
        <div class="weather-stat">
          <span class="stat-label">Temperatur</span>
          <span class="stat-value"><span id="temp">--</span>°</span>
        </div>
        <div class="weather-stat">
          <span class="stat-label">Føles som</span>
          <span class="stat-value"><span id="feels-like">--</span>°</span>
        </div>
        <div class="weather-stat">
          <span class="stat-label">Vind / Stød</span>
          <span class="stat-value"><span id="wind">--</span> <small>m/s</small></span>
        </div>
        <div class="weather-stat">
          <span class="stat-label">Nedbør</span>
          <span class="stat-value"><span id="rain">--</span> <small>mm</small></span>
        </div>
      </div>

      <div class="parameters-grid">
        <div class="param-group">
          <label for="user-type">Kuldefølsomhed</label>
          <select id="user-type" class="input-select">
            <option value="normal">Normal (Standard)</option>
            <option value="cold">Kuldeskær (Fryser nemt)</option>
            <option value="warm">Varmblodet (Sveder nemt)</option>
          </select>
        </div>
        <div class="param-group">
          <label for="route-type">Tur-type</label>
          <select id="route-type" class="input-select">
            <option value="standard">Almindelig løbetur</option>
            <option value="intense">Intens / Høj kadence (Intervaller)</option>
            <option value="windy">Åbent / Meget blæsende terræn</option>
            <option value="sheltered">Læ / Skovområde</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ANBEFALING -->
    <section id="outfit-recommendation" class="card hidden">
      <div class="card-title-row">
        <h2>2. Dagens Lag-på-Lag Outfit</h2>
      </div>
      
      <div id="outfit-list" class="outfit-cards-container"></div>

      <!-- Quick Feedback -->
      <div id="feedback-box" class="feedback-card">
        <p class="fb-title">Hvordan passede denne anbefaling?</p>
        <div class="feedback-buttons">
          <button class="btn-fb" data-rating="too_cold">🥶 For koldt</button>
          <button class="btn-fb" data-rating="perfect">👌 Perfekt</button>
          <button class="btn-fb" data-rating="too_warm">🥵 For varmt</button>
        </div>
        <div id="feedback-extra" class="hidden feedback-comment-row">
          <input type="text" id="fb-comment" placeholder="Valgfrit: Noter til turen..." class="input-text" />
          <button id="btn-send-comment" class="btn-secondary">Gem</button>
        </div>
        <p id="fb-status" class="status-msg"></p>
      </div>
    </section>

    <!-- AI CAMERA SCANNER & KLÆDESKAB -->
    <section class="card">
      <div class="card-title-row">
        <h2>3. Mit Klædeskab</h2>
      </div>

      <div class="scan-upload-box">
        <label for="camera-input" class="btn-scan">
          📷 Tilføj nyt tøj med AI Scanner
        </label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden-input">
        <p id="scan-status" class="status-msg"></p>
      </div>

      <div id="wardrobe-list" class="wardrobe-grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
